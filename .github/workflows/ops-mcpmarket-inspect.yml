name: One-time cancellation of Pipeworx form run
on:
  push:
    branches: [ops/mcpmarket-inspect-2026-09-04]
    paths: [.github/workflows/ops-mcpmarket-inspect.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the previous Pipeworx form run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST repos/Noveum/orbit/actions/runs/33862329170/cancel || true
