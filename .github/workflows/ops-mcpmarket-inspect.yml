name: One-time free MCP directory inspection

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect free MCP submission forms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect forms without submitting
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const targets = [
              ['TrackMCP', 'https://www.trackmcp.com/submit-mcp'],
              ['MCP Archive', 'https://mcp-archive.com/submit'],
              ['FindMCP', 'https://findmcp.app/submit'],
              ['Pipeworx', 'https://pipeworx.io/submit/'],
              ['ToolRoute', 'https://toolroute.io/submit'],
              ['MCPizy', 'https://mcpizy.com/submit'],
              ['MyMCPTools', 'https://mymcptools.com/submit'],
              ['MCPVault', 'https://mcpvault.io/submit'],
            ];

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'en-US',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1100 },
            });

            for (const [name, url] of targets) {
              const page = await context.newPage();
              console.log(`\n=== ${name} ${url} ===`);
              let response = null;
              try {
                response = await page.goto(url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 75000,
                });
              } catch (error) {
                console.error('NAVIGATION_ERROR', String(error));
              }
              console.log(
                `STATUS ${response?.status() ?? 'none'} FINAL ${page.url()} TITLE ${await page.title()}`,
              );
              await page.waitForTimeout(2500);

              const details = await page.evaluate(() => {
                const labelFor = (element) => {
                  const id = element.id;
                  const direct = id
                    ? document.querySelector(`label[for="${CSS.escape(id)}"]`)
                    : null;
                  const parent = element.closest('label');
                  const fieldset = element.closest('fieldset');
                  return (
                    direct?.textContent ??
                    parent?.textContent ??
                    fieldset?.querySelector('legend')?.textContent ??
                    ''
                  )
                    .replace(/\s+/g, ' ')
                    .trim();
                };

                return {
                  finalUrl: location.href,
                  forms: [...document.forms].map((form) => ({
                    action: form.action,
                    method: form.method,
                    id: form.id || null,
                    controls: form.elements.length,
                  })),
                  controls: [...document.querySelectorAll('input, textarea, select, button')].map(
                    (element) => ({
                      tag: element.tagName.toLowerCase(),
                      type: element.getAttribute('type'),
                      name: element.getAttribute('name'),
                      id: element.id || null,
                      placeholder: element.getAttribute('placeholder'),
                      ariaLabel: element.getAttribute('aria-label'),
                      label: labelFor(element),
                      value: element.getAttribute('value'),
                      required: element.hasAttribute('required'),
                      disabled: element.hasAttribute('disabled'),
                      checked: element instanceof HTMLInputElement ? element.checked : undefined,
                      text: (element.textContent ?? '').replace(/\s+/g, ' ').trim().slice(0, 700),
                      options:
                        element instanceof HTMLSelectElement
                          ? [...element.options].map((option) => ({
                              value: option.value,
                              text: option.text,
                            }))
                          : undefined,
                    }),
                  ),
                  links: [...document.querySelectorAll('a')]
                    .map((link) => ({
                      text: (link.textContent ?? '').replace(/\s+/g, ' ').trim(),
                      href: link.href,
                    }))
                    .filter((link) => /submit|list|publish|sign|login|free|fast|feature|claim/i.test(link.text + ' ' + link.href))
                    .slice(0, 100),
                  captcha: /captcha|turnstile|hcaptcha|recaptcha/i.test(
                    document.documentElement.innerHTML,
                  ),
                  payment: /stripe|checkout|credit card|pay now|fast.track|featured|\$\d+/i.test(
                    document.body.innerText,
                  ),
                  login: /sign in|log in|continue with github|create account/i.test(
                    document.body.innerText,
                  ),
                  body: document.body.innerText.replace(/\s+/g, ' ').trim().slice(0, 10000),
                };
              });
              console.log(JSON.stringify(details, null, 2));
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
