name: One-time ToolRoute inspection
on:
  push:
    branches: [ops/mcpmarket-inspect-2026-09-04]
    paths: [.github/workflows/ops-mcpmarket-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser" && cd "$RUNNER_TEMP/browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect form
        run: |
          cd "$RUNNER_TEMP/browser"
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const response = await page.goto('https://toolroute.io/submit', {
              waitUntil: 'domcontentloaded', timeout: 90000,
            });
            await page.waitForTimeout(2500);
            const result = await page.evaluate(() => ({
              status: document.body.innerText.replace(/\s+/g, ' ').slice(0, 5000),
              forms: [...document.forms].map(f => ({ action: f.action, method: f.method })),
              fields: [...document.querySelectorAll('input,textarea,select,button')].map((e, i) => ({
                i, tag: e.tagName, type: e.getAttribute('type'), name: e.getAttribute('name'),
                id: e.id, placeholder: e.getAttribute('placeholder'), value: e.getAttribute('value'),
                required: e.hasAttribute('required'), text: (e.textContent || '').trim().slice(0, 200),
                options: e.tagName === 'SELECT' ? [...e.options].map(o => [o.value, o.text]) : null,
              })),
              captcha: /captcha|turnstile|hcaptcha|recaptcha/i.test(document.documentElement.innerHTML),
              paid: /stripe|checkout|credit card|pay now|\$\d+/i.test(document.body.innerText),
            }));
            console.log('HTTP', response?.status(), 'URL', page.url());
            console.log(JSON.stringify(result));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
