name: One-time TrackMCP form inspection

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect TrackMCP free form
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect without submitting
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              locale: 'en-US',
              viewport: { width: 1440, height: 1100 },
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
            });
            const response = await page.goto('https://www.trackmcp.com/submit-mcp', {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            await page.waitForTimeout(3000);
            const summary = await page.evaluate(() => {
              const label = (element) => {
                const id = element.id;
                const linked = id ? document.querySelector(`label[for="${CSS.escape(id)}"]`) : null;
                const parent = element.closest('label');
                return (linked?.textContent ?? parent?.textContent ?? '').replace(/\s+/g, ' ').trim();
              };
              const controls = [...document.querySelectorAll('input, textarea, select, button')].map(
                (element, index) => ({
                  index,
                  tag: element.tagName.toLowerCase(),
                  type: element.getAttribute('type'),
                  name: element.getAttribute('name'),
                  id: element.id || null,
                  placeholder: element.getAttribute('placeholder'),
                  label: label(element),
                  value: element.getAttribute('value'),
                  required: element.hasAttribute('required'),
                  checked: element instanceof HTMLInputElement ? element.checked : undefined,
                  disabled: element.hasAttribute('disabled'),
                  text: (element.textContent ?? '').replace(/\s+/g, ' ').trim().slice(0, 300),
                  options:
                    element instanceof HTMLSelectElement
                      ? [...element.options].map((option) => ({ value: option.value, text: option.text }))
                      : undefined,
                }),
              );
              return {
                statusText: document.body.innerText.replace(/\s+/g, ' ').trim().slice(0, 6000),
                forms: [...document.forms].map((form) => ({
                  action: form.action,
                  method: form.method,
                  controls: form.elements.length,
                })),
                controls,
                captcha: /captcha|turnstile|hcaptcha|recaptcha/i.test(document.documentElement.innerHTML),
                payment: /\$\d+|stripe|checkout|credit card|pay now/i.test(document.body.innerText),
              };
            });
            console.log('HTTP_STATUS', response?.status());
            console.log('FINAL_URL', page.url());
            console.log('SUMMARY', JSON.stringify(summary));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
