name: One-time TrackMCP free submission

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  submit:
    name: Submit Orbit to TrackMCP free review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Submit standard free listing
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              locale: 'en-US',
              viewport: { width: 1440, height: 1100 },
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
            });
            const requests = [];
            page.on('response', (response) => {
              if (response.request().method() !== 'GET') {
                requests.push({
                  method: response.request().method(),
                  url: response.url(),
                  status: response.status(),
                });
              }
            });

            const response = await page.goto('https://www.trackmcp.com/submit-mcp', {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            if (!response || response.status() !== 200) {
              throw new Error(`Unexpected TrackMCP page status: ${response?.status() ?? 'none'}`);
            }
            await page.waitForTimeout(2500);

            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(await page.content())) {
              throw new Error('CAPTCHA detected; refusing automated submission.');
            }

            await page.locator('#gh').fill('https://github.com/Noveum/orbit');
            await page.locator('#em').fill('shashank@noveum.ai');

            const featuredButton = page.getByRole('button', { name: /get featured/i });
            if ((await featuredButton.count()) > 0) {
              const pressed = await featuredButton.first().getAttribute('aria-pressed');
              const selected = await featuredButton.first().getAttribute('data-state');
              console.log('FEATURED_STATE', JSON.stringify({ pressed, selected }));
              if (pressed === 'true' || selected === 'on' || selected === 'checked') {
                throw new Error('Featured placement appears selected; refusing submission.');
              }
            }

            const submit = page.getByRole('button', { name: 'Submit MCP', exact: true });
            if ((await submit.count()) !== 1 || !(await submit.isEnabled())) {
              throw new Error('Free submit button is missing or disabled.');
            }
            await submit.click();

            await Promise.race([
              page.waitForURL((url) => !url.href.endsWith('/submit-mcp'), { timeout: 30000 }).catch(() => null),
              page
                .waitForFunction(
                  () => /thank|success|submitted|received|review|already/i.test(document.body.innerText),
                  undefined,
                  { timeout: 30000 },
                )
                .catch(() => null),
            ]);
            await page.waitForTimeout(3000);

            const finalBody = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            console.log('FINAL_URL', page.url());
            console.log('NON_GET_RESPONSES', JSON.stringify(requests));
            console.log('FINAL_BODY', finalBody.slice(0, 8000));

            if (!/thank|success|submitted|received|review|already/i.test(finalBody)) {
              throw new Error('TrackMCP did not show a confirmed submission response.');
            }
            if (/checkout|credit card|payment details|subscribe now/i.test(finalBody)) {
              throw new Error('Unexpected payment flow appeared after free submission.');
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
