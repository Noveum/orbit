name: One-time AwesomeMCP form inspection

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect AwesomeMCP public form
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Try ordinary HTTP clients
        run: |
          set +e
          for url in \
            'https://awesomemcp.io/submit/' \
            'https://awesomemcp.io/submit' \
            'http://awesomemcp.io/submit/'; do
            echo "=== CURL $url ==="
            curl -4 --http1.1 --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 90 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36' \
              --dump-header /tmp/headers.txt --output /tmp/page.html \
              --write-out 'STATUS=%{http_code} FINAL=%{url_effective} BYTES=%{size_download}\n' \
              "$url"
            cat /tmp/headers.txt 2>/dev/null | tail -n 40
            if test -s /tmp/page.html; then
              python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          text = Path('/tmp/page.html').read_text(errors='replace')
          print('HTML_PREFIX', re.sub(r'\s+', ' ', text[:1000]))
          for tag in re.findall(r'<(?:form|input|textarea|select|option|button)\b[^>]*>', text, flags=re.I):
              print('TAG', re.sub(r'\s+', ' ', tag)[:1000])
          PY
            fi
          done

      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect with Chromium without submitting
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-http2'],
            });
            const context = await browser.newContext({
              locale: 'en-US',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1000 },
            });
            const page = await context.newPage();
            let response = null;
            let lastError = null;
            for (const url of [
              'https://awesomemcp.io/submit/',
              'https://awesomemcp.io/submit',
              'http://awesomemcp.io/submit/',
            ]) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  response = await page.goto(url, {
                    waitUntil: 'domcontentloaded',
                    timeout: 60000,
                  });
                  console.log(`NAV ${url} ATTEMPT ${attempt} STATUS ${response?.status()}`);
                  if (response && response.status() < 500) break;
                } catch (error) {
                  lastError = error;
                  console.error(`NAV_ERROR ${url} ATTEMPT ${attempt}`, String(error));
                  await page.waitForTimeout(2000);
                }
              }
              if (response && response.status() < 500) break;
            }
            if (!response) throw lastError ?? new Error('No navigation response');
            await page.waitForTimeout(3000);

            const details = await page.evaluate(() => {
              const controls = [...document.querySelectorAll('input, textarea, select, button')].map(
                (element) => ({
                  tag: element.tagName.toLowerCase(),
                  type: element.getAttribute('type'),
                  name: element.getAttribute('name'),
                  id: element.id || null,
                  placeholder: element.getAttribute('placeholder'),
                  value: element.getAttribute('value'),
                  required: element.hasAttribute('required'),
                  checked: element instanceof HTMLInputElement ? element.checked : undefined,
                  text: (element.textContent ?? '').replace(/\s+/g, ' ').trim().slice(0, 500),
                  options:
                    element instanceof HTMLSelectElement
                      ? [...element.options].map((option) => ({ value: option.value, text: option.text }))
                      : undefined,
                }),
              );
              return {
                url: location.href,
                title: document.title,
                forms: [...document.forms].map((form) => ({
                  action: form.action,
                  method: form.method,
                  id: form.id || null,
                  controls: form.elements.length,
                })),
                controls,
                body: document.body.innerText.replace(/\s+/g, ' ').trim().slice(0, 6000),
                captcha: /captcha|turnstile|hcaptcha|recaptcha/i.test(document.documentElement.innerHTML),
                payment: /stripe|checkout|credit card|pay now|\$\d+/i.test(document.body.innerText),
              };
            });
            console.log(JSON.stringify(details, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
