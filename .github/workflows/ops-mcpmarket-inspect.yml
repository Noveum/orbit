name: One-time mcp.site free submission
on:
  push:
    branches: [ops/mcpmarket-inspect-2026-09-04]
    paths: [.github/workflows/ops-mcpmarket-inspect.yml]
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser and fetch logo
        run: |
          mkdir -p "$RUNNER_TEMP/browser" && cd "$RUNNER_TEMP/browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Noveum/orbit/main/apps/web/public/logo.png \
            --output "$RUNNER_TEMP/orbit-logo.png"
          test "$(stat -c%s "$RUNNER_TEMP/orbit-logo.png")" -le 102400
      - name: Submit free listing
        run: |
          cd "$RUNNER_TEMP/browser"
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1100 }, locale: 'en-US',
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
            });
            const writes = [];
            page.on('response', async response => {
              if (response.request().method() !== 'GET') {
                let body = '';
                try { body = (await response.text()).slice(0, 1500); } catch {}
                writes.push({ method: response.request().method(), url: response.url(), status: response.status(), body });
              }
            });
            const response = await page.goto('https://mcp.site/submit', { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`Unexpected status ${response?.status()}`);
            await page.waitForTimeout(1500);
            const html = await page.content();
            const body = await page.locator('body').innerText();
            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(html)) throw new Error('CAPTCHA detected');
            if (/stripe|checkout|credit card|pay now|\$\d+/i.test(body)) throw new Error('Payment detected');

            const description = 'Free realtime task management for people and AI agents, with OAuth-scoped access to issues, sprints, projects, docs, notifications, and files.';
            if (description.length > 200) throw new Error(`Description too long: ${description.length}`);
            await page.locator('input[name="name"]').fill('Orbit by Noveum');
            await page.locator('select[name="category_id"]').selectOption('2');
            await page.locator('input[name="github_url"]').fill('https://github.com/Noveum/orbit');
            await page.locator('input[name="hosted_url"]').fill('https://orbit.noveum.ai/mcp');
            await page.locator('input[name="icon"]').setInputFiles(process.env.RUNNER_TEMP + '/orbit-logo.png');
            await page.locator('textarea[name="description"]').fill(description);
            await page.locator('input[name="contact_email"]').fill('shashank@noveum.ai');

            const submit = page.getByRole('button', { name: 'Submit for review', exact: true });
            if ((await submit.count()) !== 1 || !(await submit.isEnabled())) throw new Error('Submit button unavailable');
            const postPromise = page.waitForResponse(r => r.request().method() === 'POST' && new URL(r.url()).hostname === 'mcp.site', { timeout: 30000 });
            await submit.click();
            const post = await postPromise;
            await page.waitForLoadState('domcontentloaded').catch(() => null);
            await page.waitForTimeout(2500);
            const finalBody = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            console.log('POST_STATUS', post.status());
            console.log('FINAL_URL', page.url());
            console.log('WRITES', JSON.stringify(writes));
            console.log('FINAL_BODY', finalBody.slice(0, 9000));
            if (post.status() >= 400 || writes.some(r => r.status >= 400)) throw new Error('mcp.site submission request failed');
            if (!/thank|submitted|received|review|pending|success/i.test(finalBody) && page.url().endsWith('/submit')) {
              throw new Error('No confirmed mcp.site submission response');
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
