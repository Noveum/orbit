name: One-time MCP.Directory submission

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  submit:
    name: Submit Orbit to MCP.Directory free review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Submit free listing and record response
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'en-US',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1000 },
            });
            const page = await context.newPage();
            const responses = [];
            page.on('response', (response) => {
              if (response.request().method() !== 'GET') {
                responses.push({
                  method: response.request().method(),
                  url: response.url(),
                  status: response.status(),
                });
              }
            });

            const response = await page.goto('https://mcp.directory/submit', {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            if (!response || response.status() !== 200) {
              throw new Error(`Unexpected submit page status: ${response?.status() ?? 'none'}`);
            }
            await page.waitForTimeout(2000);

            const bodyBefore = await page.locator('body').innerText();
            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(await page.content())) {
              throw new Error('CAPTCHA detected; refusing automated submission.');
            }
            if (/\$\d+|credit card|checkout|pay now/i.test(bodyBefore)) {
              throw new Error('Payment step detected; refusing automated submission.');
            }

            const urlInput = page.locator('input[type="url"]').first();
            const textInputs = page.locator('input[type="text"]');
            const emailInput = page.locator('input[type="email"]').first();
            await urlInput.fill('https://github.com/Noveum/orbit');
            const textCount = await textInputs.count();
            if (textCount < 3) {
              throw new Error(`Expected at least three text inputs, found ${textCount}`);
            }
            await textInputs.nth(2).fill(
              'Task management for people and AI agents, with scoped OAuth access to issues, projects, and docs.',
            );
            await emailInput.fill('shashank@noveum.ai');

            const values = await page.evaluate(() =>
              [...document.querySelectorAll('input')].map((input) => ({
                type: input.type,
                placeholder: input.placeholder,
                value: input.type === 'email' ? '[contact email set]' : input.value,
                required: input.required,
              })),
            );
            console.log('FIELDS', JSON.stringify(values));

            const submit = page.getByRole('button', { name: 'Submit for Review', exact: true });
            if ((await submit.count()) !== 1 || !(await submit.isEnabled())) {
              throw new Error('Free submit button is missing or disabled.');
            }
            await submit.click();

            await Promise.race([
              page.waitForURL((url) => url.href !== 'https://mcp.directory/submit', {
                timeout: 30000,
              }).catch(() => null),
              page
                .waitForFunction(
                  () =>
                    /submitted|success|review|already|duplicate|published|thank/i.test(
                      document.body.innerText,
                    ),
                  undefined,
                  { timeout: 30000 },
                )
                .catch(() => null),
            ]);
            await page.waitForTimeout(3000);

            const finalBody = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            console.log('FINAL_URL', page.url());
            console.log('NON_GET_RESPONSES', JSON.stringify(responses));
            console.log('FINAL_BODY', finalBody.slice(0, 8000));

            const success = /thank|submitted|submission.*received|under review|already.*listed|duplicate/i.test(
              finalBody,
            );
            if (!success) {
              throw new Error('No confirmed submission or duplicate response was visible.');
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
