name: One-time MCPizy standard submission
on:
  push:
    branches: [ops/mcpmarket-inspect-2026-09-04]
    paths: [.github/workflows/ops-mcpmarket-inspect.yml]
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser" && cd "$RUNNER_TEMP/browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Submit standard free listing
        run: |
          cd "$RUNNER_TEMP/browser"
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1100 },
              locale: 'en-US',
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
            });
            const writes = [];
            page.on('response', r => {
              if (r.request().method() !== 'GET') writes.push({ method: r.request().method(), url: r.url(), status: r.status() });
            });
            const response = await page.goto('https://mcpizy.com/submit', { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`Unexpected status ${response?.status()}`);
            await page.waitForTimeout(2000);
            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(await page.content())) throw new Error('CAPTCHA detected');

            const standard = page.locator('input[name="tier"][value="standard"]');
            const fasttrack = page.locator('input[name="tier"][value="fasttrack"]');
            await standard.check();
            if (!(await standard.isChecked()) || await fasttrack.isChecked()) {
              throw new Error('Could not switch exclusively to the standard free tier');
            }

            await page.locator('input[name="repo"]').fill('https://github.com/Noveum/orbit');
            await page.waitForTimeout(2500);
            const name = page.locator('input[name="name"]');
            await name.waitFor({ state: 'attached' });
            if (await name.isDisabled()) {
              await page.waitForFunction(() => {
                const element = document.querySelector('input[name="name"]');
                return element && !element.disabled;
              }, undefined, { timeout: 20000 }).catch(() => null);
            }
            if (!(await name.isDisabled()) && (await name.inputValue()).trim().length === 0) {
              await name.fill('Orbit by Noveum');
            }
            await page.locator('input[name="email"]').fill('shashank@noveum.ai');

            const selected = await page.locator('input[name="tier"]:checked').getAttribute('value');
            const submit = page.locator('button[type="submit"]');
            const buttonText = (await submit.innerText()).trim();
            console.log('PRE_SUBMIT', JSON.stringify({ selected, buttonText, name: await name.inputValue(), nameDisabled: await name.isDisabled() }));
            if (selected !== 'standard') throw new Error(`Paid tier selected: ${selected}`);
            if (/fast.?track|stripe|pay|\$49|€49/i.test(buttonText)) throw new Error(`Paid button still active: ${buttonText}`);
            if (!(await submit.isEnabled())) throw new Error('Standard submit button disabled');

            await submit.click();
            await Promise.race([
              page.waitForURL(u => !u.href.endsWith('/submit'), { timeout: 30000 }).catch(() => null),
              page.waitForFunction(() => /success|submitted|received|review|already|duplicate|thank/i.test(document.body.innerText), undefined, { timeout: 30000 }).catch(() => null),
            ]);
            await page.waitForTimeout(2500);
            const finalBody = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            console.log('FINAL_URL', page.url());
            console.log('WRITES', JSON.stringify(writes));
            console.log('FINAL_BODY', finalBody.slice(0, 9000));

            if (/stripe\.com|checkout|payment details|pay now/i.test(page.url() + ' ' + finalBody)) {
              throw new Error('Unexpected paid flow after standard submission');
            }
            if (writes.some(r => r.status >= 500)) throw new Error('MCPizy backend error');
            if (!/success|submitted|received|review|already|duplicate|thank/i.test(finalBody)) {
              throw new Error('No confirmed MCPizy submission response');
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
