name: One-time free directory form inspection

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect free public submission forms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect forms without submitting
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const targets = [
              { name: 'OpenSourceAlternative', url: 'https://opensourcealternative.to/submit' },
              { name: 'TiloBox', url: 'https://www.tilobox.com/' },
              { name: 'MCP.Directory', url: 'https://mcp.directory/submit' },
            ];

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'en-US',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1100 },
            });

            for (const target of targets) {
              const page = await context.newPage();
              console.log(`\n=== ${target.name} ${target.url} ===`);
              let response = null;
              try {
                response = await page.goto(target.url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 90000,
                });
              } catch (error) {
                console.error('NAVIGATION_ERROR', String(error));
              }
              console.log(
                `STATUS ${response?.status() ?? 'none'} FINAL ${page.url()} TITLE ${await page.title()}`,
              );

              await page.waitForTimeout(2500);
              if (target.name === 'TiloBox') {
                const candidates = [
                  page.getByRole('link', { name: /submit a tool/i }).first(),
                  page.getByRole('button', { name: /submit a tool/i }).first(),
                  page.getByText(/submit a tool/i).first(),
                ];
                for (const candidate of candidates) {
                  if ((await candidate.count()) > 0 && (await candidate.isVisible().catch(() => false))) {
                    console.log('TILOBOX_CLICK', await candidate.evaluate((element) => element.outerHTML));
                    await candidate.click();
                    await page.waitForTimeout(2000);
                    break;
                  }
                }
              }

              const details = await page.evaluate(() => {
                const nearestText = (element) => {
                  const id = element.id;
                  const label = id
                    ? document.querySelector(`label[for="${CSS.escape(id)}"]`)
                    : element.closest('label');
                  const fieldset = element.closest('fieldset');
                  return (label?.textContent ?? fieldset?.querySelector('legend')?.textContent ?? '')
                    .replace(/\s+/g, ' ')
                    .trim();
                };
                return {
                  finalUrl: location.href,
                  forms: [...document.forms].map((form) => ({
                    action: form.action,
                    method: form.method,
                    id: form.id || null,
                    controls: form.elements.length,
                  })),
                  controls: [...document.querySelectorAll('input, textarea, select, button')].map(
                    (element) => ({
                      tag: element.tagName.toLowerCase(),
                      type: element.getAttribute('type'),
                      name: element.getAttribute('name'),
                      id: element.id || null,
                      placeholder: element.getAttribute('placeholder'),
                      ariaLabel: element.getAttribute('aria-label'),
                      label: nearestText(element),
                      value: element.getAttribute('value'),
                      required: element.hasAttribute('required'),
                      disabled: element.hasAttribute('disabled'),
                      checked: element instanceof HTMLInputElement ? element.checked : undefined,
                      text: (element.textContent ?? '').replace(/\s+/g, ' ').trim().slice(0, 500),
                      options:
                        element instanceof HTMLSelectElement
                          ? [...element.options].map((option) => ({
                              value: option.value,
                              text: option.text,
                            }))
                          : undefined,
                    }),
                  ),
                  links: [...document.querySelectorAll('a')]
                    .map((link) => ({
                      text: (link.textContent ?? '').replace(/\s+/g, ' ').trim(),
                      href: link.href,
                    }))
                    .filter((link) => /submit|waitlist|review|tool/i.test(link.text))
                    .slice(0, 50),
                  captcha: /captcha|turnstile|hcaptcha|recaptcha/i.test(
                    document.documentElement.innerHTML,
                  ),
                  payment: /stripe|checkout|credit card|pay now|\$29|\$39|\$69/i.test(
                    document.body.innerText,
                  ),
                  body: document.body.innerText.replace(/\s+/g, ' ').trim().slice(0, 7000),
                };
              });
              console.log(JSON.stringify(details, null, 2));
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
