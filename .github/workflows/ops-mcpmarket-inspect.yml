name: One-time MCPizy complete standard submission
on:
  push:
    branches: [ops/mcpmarket-inspect-2026-09-04]
    paths: [.github/workflows/ops-mcpmarket-inspect.yml]
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser" && cd "$RUNNER_TEMP/browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Submit complete standard free listing
        run: |
          cd "$RUNNER_TEMP/browser"
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1100 }, locale: 'en-US',
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
            });
            const writes = [];
            page.on('response', async r => {
              if (r.request().method() !== 'GET' && new URL(r.url()).hostname.endsWith('mcpizy.com')) {
                let body = '';
                try { body = (await r.text()).slice(0, 2000); } catch {}
                writes.push({ method: r.request().method(), url: r.url(), status: r.status(), body });
              }
            });
            const response = await page.goto('https://mcpizy.com/submit', { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`Unexpected status ${response?.status()}`);
            await page.waitForTimeout(2000);
            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(await page.content())) throw new Error('CAPTCHA detected');

            const standard = page.locator('input[name="tier"][value="standard"]');
            const fasttrack = page.locator('input[name="tier"][value="fasttrack"]');
            await standard.check();
            if (!(await standard.isChecked()) || await fasttrack.isChecked()) throw new Error('Free tier not exclusively selected');

            await page.locator('input[name="repo"]').fill('https://github.com/Noveum/orbit');
            await page.waitForTimeout(3000);
            const name = page.locator('input[name="name"]');
            await page.waitForFunction(() => {
              const e = document.querySelector('input[name="name"]');
              return e && !e.disabled;
            }, undefined, { timeout: 20000 });
            await name.fill('Orbit by Noveum');

            const category = page.locator('select[name="category"]');
            if ((await category.count()) !== 1) throw new Error('Category field not found');
            const categoryOptions = await category.locator('option').evaluateAll(options => options.map(o => ({ value: o.value, text: o.textContent })));
            console.log('CATEGORY_OPTIONS', JSON.stringify(categoryOptions));
            const preferred = categoryOptions.find(o => /productivity/i.test(o.text || '')) ?? categoryOptions.find(o => /developer/i.test(o.text || ''));
            if (!preferred || !preferred.value) throw new Error('No appropriate category option');
            await category.selectOption(preferred.value);

            const description = page.locator('textarea[name="description"]');
            if ((await description.count()) !== 1) throw new Error('Description field not found');
            await description.fill(
              'Orbit is a free, Apache-2.0 realtime task manager for software teams and AI agents. It includes issues, boards, sprints, projects, docs, analytics, GitHub integration, and a hosted Streamable HTTP MCP endpoint with more than 70 tools. OAuth 2.1 grants are revocable and bound to the authorizing user, client, and workspace; read-only clients are not offered write tools. Endpoint: https://orbit.noveum.ai/mcp.'
            );
            await page.locator('input[name="email"]').fill('shashank@noveum.ai');

            const submit = page.locator('button[type="submit"]');
            const buttonText = (await submit.innerText()).trim();
            console.log('PRE_SUBMIT', JSON.stringify({ tier: await page.locator('input[name="tier"]:checked').getAttribute('value'), buttonText, name: await name.inputValue(), category: await category.inputValue() }));
            if (/fast.?track|stripe|pay|\$49|€49/i.test(buttonText)) throw new Error(`Paid button active: ${buttonText}`);
            if (!(await submit.isEnabled())) throw new Error('Free submit button disabled');

            await submit.click();
            await Promise.race([
              page.waitForURL(u => !u.href.endsWith('/submit'), { timeout: 70000 }).catch(() => null),
              page.waitForFunction(() => /thank you|submitted successfully|submission received|added to.*queue|already submitted|already exists/i.test(document.body.innerText), undefined, { timeout: 70000 }).catch(() => null),
              page.waitForFunction(() => {
                const b = document.querySelector('button[type="submit"]');
                return b && !/sending/i.test(b.textContent || '');
              }, undefined, { timeout: 70000 }).catch(() => null),
            ]);
            await page.waitForTimeout(3000);
            const finalBody = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            const finalButton = (await submit.count()) ? (await submit.innerText()).trim() : '[gone]';
            console.log('FINAL_URL', page.url());
            console.log('WRITES', JSON.stringify(writes));
            console.log('FINAL_BUTTON', finalButton);
            console.log('FINAL_BODY', finalBody.slice(0, 10000));

            if (/stripe\.com|checkout|payment details|pay now/i.test(page.url() + ' ' + finalBody)) throw new Error('Unexpected payment flow');
            if (writes.length === 0) throw new Error('No MCPizy submission request was observed');
            if (writes.some(r => r.status >= 400)) throw new Error('MCPizy submission request failed');
            if (!/thank you|submitted successfully|submission received|queue|already submitted|already exists/i.test(finalBody) && page.url().endsWith('/submit')) {
              throw new Error('MCPizy did not confirm submission');
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
