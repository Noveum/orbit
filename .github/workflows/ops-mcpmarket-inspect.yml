name: One-time MCP Archive free submission

on:
  push:
    branches:
      - ops/mcpmarket-inspect-2026-09-04
    paths:
      - .github/workflows/ops-mcpmarket-inspect.yml

permissions:
  contents: read

jobs:
  submit:
    name: Submit Orbit to MCP Archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Submit free listing and record response
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              locale: 'en-US',
              viewport: { width: 1440, height: 1100 },
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
            });
            const responses = [];
            page.on('response', (response) => {
              if (response.request().method() !== 'GET') {
                responses.push({
                  method: response.request().method(),
                  url: response.url(),
                  status: response.status(),
                });
              }
            });

            const response = await page.goto('https://mcp-archive.com/submit', {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            if (!response || response.status() !== 200) {
              throw new Error(`Unexpected MCP Archive status: ${response?.status() ?? 'none'}`);
            }
            await page.waitForTimeout(2500);

            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(await page.content())) {
              throw new Error('CAPTCHA detected; refusing automated submission.');
            }
            if (/stripe|checkout|credit card|pay now|\$\d+/i.test(await page.locator('body').innerText())) {
              throw new Error('Payment step detected; refusing automated submission.');
            }

            await page.locator('#name').fill('Orbit by Noveum');
            await page.locator('#company').fill('Noveum AI');
            await page.locator('#description').fill(
              'Orbit is a free, realtime task and project manager for software teams and AI agents. Its hosted Streamable HTTP MCP server exposes more than 70 tools for issues, comments, teams, workflow states, labels, sprints, projects, milestones, docs, views, notifications, attachments, and workspace instructions. Authentication uses OAuth 2.1 with dynamic client registration and PKCE. Grants are bound to the authorizing user, client, and workspace, are revocable, and expose read or write tools according to approved scopes. Every MCP operation uses the same server-side permission policy as the Orbit application. Source: https://github.com/Noveum/orbit. License: Apache-2.0.',
            );
            await page.locator('#url').fill('https://orbit.noveum.ai/mcp');
            await page.locator('#price').fill('Free');
            await page
              .locator('#tags')
              .fill('Project Management, Task Management, Productivity, OAuth, Streamable HTTP, Open Source');
            await page.locator('#email').fill('shashank@noveum.ai');

            const submit = page.getByRole('button', { name: 'Submit MCP Server', exact: true });
            if ((await submit.count()) !== 1 || !(await submit.isEnabled())) {
              throw new Error('Submit button is missing or disabled.');
            }
            await submit.click();

            await Promise.race([
              page.waitForURL((url) => !url.href.endsWith('/submit'), { timeout: 30000 }).catch(() => null),
              page
                .waitForFunction(
                  () => /thank|success|submitted|received|review|already|duplicate/i.test(document.body.innerText),
                  undefined,
                  { timeout: 30000 },
                )
                .catch(() => null),
            ]);
            await page.waitForTimeout(3000);

            const finalBody = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            console.log('FINAL_URL', page.url());
            console.log('NON_GET_RESPONSES', JSON.stringify(responses));
            console.log('FINAL_BODY', finalBody.slice(0, 8000));

            if (!/thank|success|submitted|received|review|already|duplicate/i.test(finalBody)) {
              throw new Error('No confirmed MCP Archive submission response was visible.');
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
