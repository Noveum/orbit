name: One-time additional MCP directory inspection

on:
  push:
    branches:
      - ops/mcp-directory-batch-2-2026-09-04
    paths:
      - .github/workflows/ops-mcp-directory-batch-2.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect additional MCP submission routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Inspect without submitting
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const targets = [
              'https://www.trackmcp.com/submit-mcp',
              'https://mymcptools.com/submit',
              'https://agentndx.ai/submit',
              'https://www.aimcp.info/en/submit',
              'https://mcpera.com/submit.html',
              'https://www.mcpinstall.com/submit',
            ];
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'en-US',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1100 },
            });

            for (const url of targets) {
              const page = await context.newPage();
              try {
                const response = await page.goto(url, {
                  waitUntil: 'domcontentloaded',
                  timeout: 45000,
                });
                await page.waitForTimeout(4000);
                console.log(`\n=== ${url} ===`);
                console.log(
                  `STATUS ${response?.status() ?? 'none'} FINAL ${page.url()} TITLE ${await page.title()}`,
                );
                const details = await page.evaluate(() => {
                  const compact = (value) => (value ?? '').replace(/\s+/g, ' ').trim();
                  function labelFor(element) {
                    const id = element.id;
                    const direct = id
                      ? document.querySelector(`label[for="${CSS.escape(id)}"]`)
                      : null;
                    const wrapper = element.closest('label');
                    const previous = element.previousElementSibling;
                    return compact(
                      `${direct?.textContent ?? wrapper?.textContent ?? ''} ${
                        previous?.tagName === 'LABEL' ? previous.textContent : ''
                      }`,
                    );
                  }
                  const body = compact(document.body.innerText);
                  return {
                    forms: [...document.forms].map((form) => ({
                      action: form.action,
                      method: form.method,
                      id: form.id || null,
                      controls: form.elements.length,
                    })),
                    controls: [...document.querySelectorAll('input, textarea, select, button')].map(
                      (element) => ({
                        tag: element.tagName.toLowerCase(),
                        type: element.getAttribute('type'),
                        name: element.getAttribute('name'),
                        id: element.id || null,
                        placeholder: element.getAttribute('placeholder'),
                        label: labelFor(element),
                        required: element.hasAttribute('required'),
                        checked:
                          element instanceof HTMLInputElement &&
                          ['checkbox', 'radio'].includes(element.type)
                            ? element.checked
                            : undefined,
                        text: compact(element.textContent).slice(0, 240),
                        options:
                          element instanceof HTMLSelectElement
                            ? [...element.options].map((option) => ({
                                value: option.value,
                                text: option.text,
                              }))
                            : undefined,
                      }),
                    ),
                    bodyExcerpt: body.slice(0, 6500),
                    captcha: /captcha|turnstile|hcaptcha|recaptcha/i.test(
                      `${body} ${document.documentElement.innerHTML}`,
                    ),
                    payment: /\$\s*\d+|credit card|checkout|payment required|paid submission/i.test(body),
                    login: /log in|login|sign in|continue with github|continue with google/i.test(body),
                  };
                });
                console.log(JSON.stringify(details, null, 2));
              } catch (error) {
                console.error(`INSPECTION FAILED ${url}:`, error);
              } finally {
                await page.close();
              }
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
