name: One-time TrackMCP free submission

on:
  push:
    branches:
      - ops/mcp-directory-batch-2-2026-09-04
    paths:
      - .github/workflows/ops-mcp-directory-batch-2.yml

permissions:
  contents: read

jobs:
  submit:
    name: Submit Orbit to TrackMCP free review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-browser"
          cd "$RUNNER_TEMP/orbit-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Submit free listing
        run: |
          cd "$RUNNER_TEMP/orbit-browser"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'en-US',
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1440, height: 1000 },
            });
            const page = await context.newPage();
            const nonGet = [];
            page.on('response', (response) => {
              if (response.request().method() !== 'GET') {
                nonGet.push({
                  method: response.request().method(),
                  url: response.url(),
                  status: response.status(),
                });
              }
            });

            const response = await page.goto('https://www.trackmcp.com/submit-mcp', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(2500);
            if (response?.status() !== 200) {
              throw new Error(`Submission page returned ${response?.status() ?? 'no response'}`);
            }

            const bodyBefore = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            if (/captcha|turnstile|hcaptcha|recaptcha/i.test(bodyBefore)) {
              throw new Error('CAPTCHA detected; no bypass attempted');
            }
            if (!/Always free/i.test(bodyBefore) || !/Get featured\s*\$8\/mo/i.test(bodyBefore)) {
              throw new Error('Could not distinguish the free form from optional paid featuring');
            }

            await page.locator('#gh').fill('https://github.com/Noveum/orbit');
            await page.locator('#em').fill('shashank@noveum.ai');

            const featured = page.getByRole('button', { name: /get featured/i });
            const submit = page.getByRole('button', { name: /^submit mcp$/i });
            if ((await featured.count()) !== 1 || (await submit.count()) !== 1) {
              throw new Error(
                `Expected one featured and one submit button; featured=${await featured.count()} submit=${await submit.count()}`,
              );
            }

            await submit.click();
            await page.waitForTimeout(7000);
            await page.waitForLoadState('networkidle', { timeout: 25000 }).catch(() => undefined);

            const finalUrl = page.url();
            const bodyAfter = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            const lower = bodyAfter.toLowerCase();
            console.log('FINAL_URL', finalUrl);
            console.log('NON_GET_RESPONSES', JSON.stringify(nonGet));
            console.log('BODY_EXCERPT', bodyAfter.slice(0, 5000));

            if (/stripe\.com|checkout|payment/.test(finalUrl.toLowerCase())) {
              throw new Error('Unexpected payment redirect; no paid featuring was authorized');
            }
            if (/error|failed|invalid|try again/.test(lower)) {
              throw new Error('Submission page displayed an error state');
            }
            if (!/thank|submitted|submission|review|received|success|confirmation/.test(lower)) {
              throw new Error('Could not confirm a free submission acknowledgement');
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
