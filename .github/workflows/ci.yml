name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  static:
    name: Lint, comments, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Biome lint and format check
        run: bun run lint
      - name: No-comment policy
        run: bun run check-comments
      - name: One copy of every overridden dependency
        run: bun run check-deps
      - name: Typecheck
        run: bun run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5433/orbit
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:3100
      GITHUB_APP_SLUG: orbit-ci
      GITHUB_APP_ID: "1"
      GITHUB_APP_CLIENT_ID: Iv1.ci
      GITHUB_APP_CLIENT_SECRET: ci-github-app-client-secret
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Mint a throwaway signing key for the GitHub connect tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/orbit-ci-app-key.pem
          {
            echo "GITHUB_APP_PRIVATE_KEY<<ORBIT_CI_KEY_EOF"
            cat /tmp/orbit-ci-app-key.pem
            echo "ORBIT_CI_KEY_EOF"
          } >> "$GITHUB_ENV"
      - name: Create an isolated database per package
        run: |
          for db in orbit_test_core orbit_test_svc orbit_test_rt orbit_test_rts orbit_test_mcp orbit_test_web; do
            PGPASSWORD=orbit createdb -h localhost -p 5433 -U orbit "$db"
          done
      - name: Push the schema to every database
        run: |
          for db in orbit orbit_test_core orbit_test_svc orbit_test_rt orbit_test_rts orbit_test_mcp orbit_test_web; do
            DATABASE_URL="postgres://orbit:orbit@localhost:5433/$db" bun run --filter '@orbit/db' push
          done
      - name: Run tests
        run: bun run test

  schema:
    name: Migrations match the schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5433/orbit_from_migrations
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: A database built the way someone installing this would build one
        run: |
          PGPASSWORD=orbit createdb -h localhost -p 5433 -U orbit orbit_from_migrations
          bun run --filter '@orbit/db' migrate
      - name: The committed migrations carry everything the schema declares
        run: bun run db:check-drift

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5433/orbit
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5433/orbit
      ORBIT_SEED_CONFIRM_TARGET: localhost:5433/orbit:user-sha256:4fa1a13ac468ac495f3390e859d76d5e8ef49806815b45a21de7711bcc624194
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:3100
      REALTIME_PORT: "3100"
      ORBIT_DEV_LOGIN: "1"
      ORBIT_E2E_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9010
      S3_REGION: us-east-1
      S3_BUCKET: orbit-uploads
      S3_ACCESS_KEY_ID: orbitminio
      S3_SECRET_ACCESS_KEY: orbitminio
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: The dev scripts read the repository env file
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ORBIT_SEED_CONFIRM_TARGET=$ORBIT_SEED_CONFIRM_TARGET"
            echo "REDIS_URL=$REDIS_URL"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=$BETTER_AUTH_URL"
            echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"
            echo "NEXT_PUBLIC_REALTIME_URL=$NEXT_PUBLIC_REALTIME_URL"
            echo "REALTIME_PORT=$REALTIME_PORT"
            echo "ORBIT_DEV_LOGIN=$ORBIT_DEV_LOGIN"
            echo "ORBIT_E2E_BASE_URL=$ORBIT_E2E_BASE_URL"
            echo "S3_ENDPOINT=$S3_ENDPOINT"
            echo "S3_REGION=$S3_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID"
            echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY"
          } > .env
      - name: Start object storage the same way the compose file does
        run: |
          docker run -d --name orbit-minio -p 9010:9000 \
            -e MINIO_ROOT_USER=orbitminio \
            -e MINIO_ROOT_PASSWORD=orbitminio \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9010/minio/health/live >/dev/null; then
              echo "minio is up after ${attempt} attempts"
              docker run --rm --network host --entrypoint sh minio/mc:latest -c \
                "mc alias set orbit http://localhost:9010 orbitminio orbitminio && mc mb --ignore-existing orbit/orbit-uploads"
              exit 0
            fi
            sleep 2
          done
          echo "minio never became healthy" >&2
          docker logs orbit-minio >&2 || true
          exit 1
      - name: Apply the schema to the e2e database
        run: bun run --filter '@orbit/db' push
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Boot the realtime and web servers
        run: |
          nohup bun run --filter '@orbit/realtime' dev > "$RUNNER_TEMP/realtime.log" 2>&1 &
          disown
          nohup bun run --filter '@orbit/web' dev > "$RUNNER_TEMP/web.log" 2>&1 &
          disown
      - name: Wait for the web server to answer its health check
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "web is up after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "web never became healthy" >&2
          cat "$RUNNER_TEMP/web.log" >&2 || true
          exit 1
      - name: Wait for the realtime server to answer its health check
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "http://localhost:${REALTIME_PORT}/health" >/dev/null 2>&1; then
              echo "realtime is up after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "realtime never became healthy" >&2
          cat "$RUNNER_TEMP/realtime.log" >&2 || true
          exit 1
      - name: Run the end-to-end suite
        run: bun run test:e2e
      - name: Show what the servers logged
        if: failure()
        run: |
          echo "::group::web"
          cat "$RUNNER_TEMP/web.log" || true
          echo "::endgroup::"
          echo "::group::realtime"
          cat "$RUNNER_TEMP/realtime.log" || true
          echo "::endgroup::"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== web ==="; cat "$RUNNER_TEMP/web.log" || true
          echo "=== realtime ==="; cat "$RUNNER_TEMP/realtime.log" || true
