name: Continuous Recovery Drill

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/services/src/backup/**'
      - 'packages/services/tests/backup/**'
      - 'scripts/backup/**'
      - 'scripts/backup-recovery-drill.test.ts'
      - 'scripts/backup-upgrade-matrix.test.ts'
      - 'packages/db/drizzle/**'
      - 'package.json'
      - 'scripts/tsconfig.json'
      - '.github/workflows/recovery-drill.yml'

permissions:
  contents: read

concurrency:
  group: recovery-drill-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  recovery-drill:
    name: Recovery drill and upgrade matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5433/orbit_recovery_drill
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9010
      S3_REGION: us-east-1
      S3_BUCKET: orbit-uploads
      S3_ACCESS_KEY_ID: orbitminio
      S3_SECRET_ACCESS_KEY: orbitminio
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Start MinIO object storage
        run: |
          docker run -d --name orbit-minio -p 9010:9000 \
            -e MINIO_ROOT_USER=orbitminio \
            -e MINIO_ROOT_PASSWORD=orbitminio \
            docker.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9010/minio/health/live >/dev/null; then
              docker run --rm --network host --entrypoint sh docker.io/pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd -c \
                "mc alias set orbit http://localhost:9010 orbitminio orbitminio && mc mb --ignore-existing orbit/orbit-uploads"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to initialize" >&2
          exit 1
      - name: Install PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Create isolated drill database
        run: |
          PGPASSWORD=orbit createdb -h localhost -p 5433 -U orbit orbit_recovery_drill
          bun run --filter '@orbit/db' migrate
      - name: Execute automated continuous recovery drill
        run: |
          mkdir -p artifacts
          set -o pipefail
          bun run backup:recovery-drill \
            --database-url="$DATABASE_URL" \
            --redis-url="$REDIS_URL" \
            --confirm-destructive="localhost:5433/db/orbit_recovery_drill#bucket:orbit-uploads" \
            --json | tee artifacts/recovery-drill-report.json
      - name: Execute automated upgrade matrix
        run: |
          set -o pipefail
          bun run backup:upgrade-matrix \
            --database-url="$DATABASE_URL" \
            --confirm-destructive="localhost:5433/db/orbit_recovery_drill#bucket:orbit-uploads" \
            --json | tee artifacts/upgrade-matrix-report.json
      - name: Upload drill metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-drill-reports
          path: artifacts/
