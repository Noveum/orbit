apiVersion: batch/v1
kind: CronJob
metadata:
  name: orbit-backup
  namespace: orbit
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: ghcr.io/noveum/orbit-tools:latest
              command: ["/bin/bash", "deploy/backup/run-backup-and-prune.sh"]
              env:
                - name: DIRECT_URL
                  valueFrom:
                    secretKeyRef:
                      name: orbit-secrets
                      key: DIRECT_URL
                - name: S3_BUCKET
                  value: "orbit-uploads"
                - name: S3_REGION
                  value: "us-east-1"
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: orbit-secrets
                      key: S3_ACCESS_KEY_ID
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: orbit-secrets
                      key: S3_SECRET_ACCESS_KEY
                - name: ORBIT_BACKUP_DESTINATION
                  value: "/backups"
                - name: ORBIT_BACKUP_ENCRYPT
                  value: "true"
                - name: ORBIT_BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: orbit-backup-key
                      key: ENCRYPTION_KEY
                - name: ORBIT_BACKUP_KEEP_COUNT
                  value: "30"
                - name: ORBIT_BACKUP_KEEP_DAYS
                  value: "14"
                - name: ORBIT_BACKUP_MAX_BYTES
                  value: "50GB"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: orbit-backup-pvc
