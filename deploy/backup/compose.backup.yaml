services:
  backup-runner:
    image: ghcr.io/noveum/orbit-tools:latest
    container_name: orbit-backup-runner
    restart: "no"
    environment:
      DIRECT_URL: ${DIRECT_URL:-postgres://postgres:postgres@postgres:5432/orbit}
      S3_BUCKET: ${S3_BUCKET:-orbit-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orbit-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orbit-secret-key}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ORBIT_BACKUP_DESTINATION: /backups
      ORBIT_BACKUP_ENCRYPT: ${ORBIT_BACKUP_ENCRYPT:-true}
      ORBIT_BACKUP_ENCRYPTION_KEY: ${ORBIT_BACKUP_ENCRYPTION_KEY:-}
      ORBIT_BACKUP_ENCRYPTION_KEY_ID: ${ORBIT_BACKUP_ENCRYPTION_KEY_ID:-prod-2026}
      ORBIT_BACKUP_KEEP_COUNT: ${ORBIT_BACKUP_KEEP_COUNT:-30}
      ORBIT_BACKUP_KEEP_DAYS: ${ORBIT_BACKUP_KEEP_DAYS:-14}
      ORBIT_BACKUP_MAX_BYTES: ${ORBIT_BACKUP_MAX_BYTES:-50GB}
    volumes:
      - orbit_backups:/backups
    command: ["/bin/bash", "deploy/backup/run-backup-and-prune.sh"]

volumes:
  orbit_backups:
    name: orbit_backups
