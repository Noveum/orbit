name: orbit-preview

x-app-environment: &app-environment
  DATABASE_URL: postgres://orbit:${POSTGRES_PASSWORD:?Run bun run preview:init}@postgres:5432/orbit
  DIRECT_URL: postgres://orbit:${POSTGRES_PASSWORD:?Run bun run preview:init}@postgres:5432/orbit
  DATABASE_PREPARED_STATEMENTS: "true"
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run bun run preview:init}
  BETTER_AUTH_URL: http://127.0.0.1:33170
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:33170
  ORBIT_PASSWORD_AUTH: "true"
  S3_ENDPOINT: http://orbit-storage.localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: orbit-uploads
  S3_ACCESS_KEY_ID: orbit
  S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run bun run preview:init}
  NEXT_TELEMETRY_DISABLED: "1"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bun run preview:init}
      POSTGRES_DB: orbit
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: orbit
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run bun run preview:init}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:33170
    networks:
      default:
        aliases: [orbit-storage.localhost]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bucket:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      MC_HOST_orbit: http://orbit:${MINIO_PASSWORD:?Run bun run preview:init}@storage:9000
    entrypoint: [mc]
    command: [mb, --ignore-existing, orbit/orbit-uploads]
    depends_on:
      storage:
        condition: service_healthy

  tools:
    profiles: [tools]
    cpuset: ${ORBIT_PREVIEW_BUILD_CPUS:-0-1}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.tools
    environment: *app-environment
    volumes:
      - ../../.artifacts/docker-preview:/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully

  web:
    build:
      context: ../../.artifacts/docker-preview/standalone
      dockerfile: ../../../deploy/docker/Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:33170:3000"
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
  redis:
  storage:
